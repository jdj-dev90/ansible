---
- name: Ensure language toolchain packages are installed
  ansible.builtin.package:
    name:
      # go
      - go
      - golangci-lint
      # python
      - python
      - python-pip
      - pyenv
      # node: no bare `nodejs`. That forces one specific provider and
      # conflicts with an installed nodejs-lts-iron; npm already depends on
      # nodejs>=20.17.0, so pacman picks whichever provider is present -- the
      # LTS package on an existing machine, plain nodejs on a fresh one.
      # Version switching is fnm's job, not the system package manager's.
      # `nvm` was declared here but is never sourced by the shell config.
      - npm
      - fnm
      # rust tooling
      - rust-analyzer
      # linters / formatters
      - eslint
      - eslint_d
      - stylua
      - yamllint
      # build deps for pyenv-compiled interpreters
      - openssl
      - zlib
      - xz
      - bzip2
      - libffi
      - sqlite
      - readline
      - tk
    state: present
