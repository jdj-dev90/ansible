---
# The Wayland desktop itself: compositor, shell components, portals, fonts,
# audio. User-facing applications live in the `apps` role.
#
# Every package here is an official-repo package -- verified against the real
# machine, none appear in the foreign/AUR list -- so this role needs no AUR
# entry at all.
- name: Ensure desktop packages are installed
  ansible.builtin.package:
    name:
      # compositor
      - hyprland
      - hyprshot
      # xorg-xwayland is NOT X11 cruft: Hyprland needs it for X11 clients
      - xorg-xwayland
      # shell components
      - waybar
      - swaync
      - wofi
      - cliphist
      - wl-clipboard
      # display / output management
      - kanshi
      - nwg-displays
      # portals -- screen sharing, file pickers
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-hyprland
      # audio
      - pipewire-pulse
      - wireplumber
      - alsa-utils
      - pavucontrol
      # theming and secrets agent
      - python-pywal
      - gnome-keyring
      # fonts
      - ttf-jetbrains-mono-nerd
      - ttf-inconsolata
      - otf-font-awesome
      - woff2-font-awesome
    state: present

# gnome-keyring's gcr agent hijacks SSH_AUTH_SOCK via a set-environment call in
# its socket unit. It answers a key listing instantly but blocks forever on a
# signing request, waiting for a graphical confirmation -- so anything
# non-interactive hangs rather than failing, and BatchMode does not help
# because the block is in the agent rather than in ssh.
#
# This lives here, not in ssh_key, because gnome-keyring is installed by the
# task above: on a freshly built machine the gcr units do not exist yet when
# ssh_key runs, so masking there failed outright and nothing masked them once
# they did appear.
#
# The units are enabled in GLOBAL scope, so disabling per-user does not survive
# a re-login -- masking is what actually persists. Only the ssh half is
# disabled; the secrets and pkcs11 components are untouched.
- name: Mask the gnome-keyring SSH agent
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    masked: true
    enabled: false
  loop:
    - gcr-ssh-agent.socket
    - gcr-ssh-agent.service
  become: true
  become_user: "{{ user_name }}"

# Arch ships this; it needs SSH_AUTH_SOCK pointed at it, which the dotfiles
# `wayland` package does via .config/environment.d/10-ssh-agent.conf.
- name: Enable the plain OpenSSH agent
  ansible.builtin.systemd_service:
    name: ssh-agent.socket
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ user_name }}"

# DisplayLink dock. The dock is a USB device with a userspace driver, so it is
# vendor-agnostic -- but it drives displays through an out-of-tree DKMS module
# (evdi) rather than the normal DRM path, which is why it is opt-in per machine.
#
# Hyprland does not officially support DisplayLink and it was long broken on
# Intel graphics; the aquamarine patch makes it work in practice. Treat a
# working dock as something to verify after a kernel upgrade, not assume.
- name: Ensure kernel headers are present for the evdi DKMS module
  ansible.builtin.package:
    name:
      - linux-headers
    state: present
  when: displaylink_enabled

- name: Install DisplayLink packages
  ansible.builtin.include_role:
    name: aur
  vars:
    aur_packages:
      - displaylink
      - evdi-dkms-git
  when: displaylink_enabled

- name: Enable and start the DisplayLink driver
  ansible.builtin.systemd_service:
    name: displaylink.service
    enabled: true
    state: started
  when: displaylink_enabled

# These units ship in the dotfiles `wayland` stow package, so the dotfiles role
# must already have run. `systemd --user` also needs the user's own session bus,
# which is not inherited when Ansible runs under sudo -- hence the explicit
# XDG_RUNTIME_DIR.
- name: Check the user unit files are stowed
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/systemd/user/{{ item }}"
  register: gui_unit_files
  loop: "{{ user_services }}"

- name: Fail if a user unit is missing
  ansible.builtin.fail:
    msg: >-
      {{ item.item }} is not present in ~/.config/systemd/user. The dotfiles
      role must run before this one.
  when: not item.stat.exists
  loop: "{{ gui_unit_files.results }}"
  loop_control:
    label: "{{ item.item }}"

# Enabling is always safe and idempotent. STARTING is not: these units depend
# on hardware that may simply not be present -- audio-defaults pins a specific
# USB headset by name and exits 1 with "No such entity" whenever it is
# unplugged. That is a property of the unit, not a provisioning failure, so a
# failed start must not abort the play. It is reported instead.
- name: Enable user services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: true
    daemon_reload: true
  loop: "{{ user_services }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  become: true
  become_user: "{{ user_name }}"

# Enabling is the durable part and is always correct. STARTING only makes
# sense inside a graphical session: these units need a compositor, so on a
# machine being built -- or any headless run -- they start, fail to find a
# display, exit, and get started again on the next run forever. That reports
# `changed` every time and never converges.
- name: Check whether a Wayland session is running
  ansible.builtin.stat:
    path: "/run/user/{{ user_uid }}/hypr"
  register: gui_session

- name: Start user services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    state: started
  loop: "{{ user_services }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  register: gui_service_start
  failed_when: false
  when: gui_session.stat.exists
  become: true
  become_user: "{{ user_name }}"

- name: Report that user services were only enabled
  ansible.builtin.debug:
    msg: >-
      No compositor is running, so the user services were enabled but not
      started. They will come up with the next graphical session.
  when: not gui_session.stat.exists

- name: Report user services that would not start
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} is enabled but did not start. Usually means the hardware
      it depends on is absent. Check:
      systemctl --user status {{ item.item }}
  when:
    - gui_session.stat.exists
    - item.failed | default(false)
  loop: "{{ gui_service_start.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

# Restowing the dotfiles replaces the config symlinks, and Hyprland does not
# recover on its own: it sees the config disappear, falls back to built-in
# defaults, and stays there. The symptom is a working desktop with the wrong
# borders, animations and keybinds -- easy to misread as a broken config rather
# than an unloaded one. Reload explicitly after the dotfiles role has run.
- name: Reload Hyprland if it is running
  ansible.builtin.shell: |
    set -euo pipefail
    # Guard the directory first so the pipe below cannot fail under pipefail.
    [ -d "$XDG_RUNTIME_DIR/hypr" ] || exit 0
    sig=$(ls -t "$XDG_RUNTIME_DIR/hypr" | head -1)
    [ -n "$sig" ] || exit 0
    HYPRLAND_INSTANCE_SIGNATURE="$sig" hyprctl reload
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  register: gui_hypr_reload
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user_name }}"

- name: Report the Hyprland reload
  ansible.builtin.debug:
    msg: >-
      Hyprland was not running, so its config was not reloaded. If you are on a
      graphical session and settings look wrong, run `hyprctl reload`.
  when: gui_hypr_reload.rc | default(0) != 0
