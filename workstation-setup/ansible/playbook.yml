---
- name: Workstation setup
  hosts: localhost
  connection: local
  become: true

  vars:
    # Which machine is this? Defaults to the running hostname, so a named
    # machine needs no arguments. A freshly installed box whose hostname is
    # not set yet is told explicitly:
    #   ansible-playbook playbook.yml -e profile=jordan-work
    profile: "{{ ansible_hostname }}"

  vars_files:
    - vars/common.yml
    - "vars/{{ profile }}.yml"

  # Play-level so every git task inherits it -- setting it per-task invites
  # exactly the coverage gap this replaces. Inert for non-git tasks.
  #
  # SSH_AUTH_SOCK has to be stated explicitly: `become_user` resets the
  # environment, so a key loaded in the user's own shell is invisible to any
  # task that becomes them. Without this every SSH operation falls back to the
  # key file, hits the passphrase prompt, and fails under BatchMode -- even
  # though the agent is running and loaded.
  environment:
    GIT_SSH_COMMAND: "{{ git_ssh_command }}"
    # default() is load-bearing: play-level environment is templated for EVERY
    # task, including the two pre_tasks that run before user_uid is set. The
    # fallback path simply does not exist, which is harmless -- neither of those
    # tasks touches SSH.
    SSH_AUTH_SOCK: "/run/user/{{ user_uid | default(0) }}/ssh-agent.socket"

  pre_tasks:
    # Must be first: the play-level SSH_AUTH_SOCK is templated from it.
    - name: Look up the user's uid
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_name }}"

    - name: Record the uid
      ansible.builtin.set_fact:
        user_uid: "{{ ansible_facts.getent_passwd[user_name][1] }}"

    - name: Show which profile is being applied
      ansible.builtin.debug:
        msg: >-
          profile={{ profile }} hostname={{ hostname }}
          (running hostname: {{ ansible_hostname }})

    # Three roles reach GitHub over SSH, and a graphical SSH agent
    # (gnome-keyring's gcr) blocks forever on a signing request rather than
    # failing -- so those tasks would hang, not error. Verified: even
    # BatchMode=yes still hangs, because the block is in the agent, not in ssh.
    # Hence the explicit `timeout`. Checking here surfaces it before any role
    # has changed anything.
    - name: Check SSH access to GitHub
      ansible.builtin.command: >-
        timeout 25 ssh -T -o BatchMode=yes -o ConnectTimeout=15
        -o StrictHostKeyChecking=accept-new git@github.com
      register: preflight_ssh
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ user_name }}"

    - name: Fail early if GitHub SSH is not usable non-interactively
      ansible.builtin.fail:
        msg: >-
          SSH to GitHub did not authenticate non-interactively, so the
          dotfiles and password-store clones would hang. If ssh reported
          nothing at all below, the SSH agent blocked and the check timed out --
          typically gnome-keyring's gcr agent waiting on a GUI prompt. Load the
          key into a plain ssh-agent (keychain does this) and re-run.
          ssh said: {{ preflight_ssh.stderr | default('') | trim }}
      when: "'successfully authenticated' not in (preflight_ssh.stderr | default(''))"

    - name: Fail early if this machine has no profile
      ansible.builtin.assert:
        that:
          - hostname is defined
        fail_msg: >-
          No vars/{{ profile }}.yml found. Create one, or pass a known profile
          with -e profile=<name>.

  roles:
    - base
    - dev
    - ssh_key
    - dotfiles
    - shell
    - lang
    # Work tooling. Correct as an end state: it currently also lives on archbox
    # out of necessity, but that install is manual and is left alone -- this
    # playbook simply does not manage it there. See issue #6.
    - role: cloud
      when: profile == 'jordan-work'
    # Password store. Used on both machines today; how it should be split is
    # still open. See issue #9.
    - pass
    - gui
    - apps
