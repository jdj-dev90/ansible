---
- name: Ensure pass packages are installed
  ansible.builtin.package:
    name:
      - gnupg
      - pass
      - pinentry
    state: present

# The GPG key is imported once, by hand, from an export dropped in ~/Downloads.
# That export is a bootstrap artifact and is normally long gone -- so demanding
# it on every run makes the playbook abort on an already-working machine. Check
# the keyring first; only require the file if the key is genuinely absent.
- name: List current secret keys
  ansible.builtin.command: gpg --list-secret-keys --with-colons
  register: pass_gpg_secret_keys
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user_name }}"

- name: Check for the GPG key export
  ansible.builtin.stat:
    path: "{{ gpg_key_path }}"
  register: pass_gpg_key_file

- name: Fail only if the key is neither imported nor available to import
  ansible.builtin.fail:
    msg: >-
      GPG key {{ gpg_fingerprint }} is not in the keyring, and no export exists
      at {{ gpg_key_path }}. Export the key there, then re-run.
  when:
    - gpg_fingerprint not in pass_gpg_secret_keys.stdout
    - not pass_gpg_key_file.stat.exists

- name: Import GPG key
  ansible.builtin.command: "gpg --import {{ gpg_key_path }}"
  when:
    - gpg_fingerprint not in pass_gpg_secret_keys.stdout
    - pass_gpg_key_file.stat.exists
  changed_when: true
  become: true
  become_user: "{{ user_name }}"

# NOTE ON DESTRUCTIVENESS -- this role destroyed data once already.
# ansible.builtin.git with update:true resolves to `git reset --hard`. The
# password store accumulates commits locally every time `pass` writes an entry,
# and they are only pushed when you remember to. Resetting it to the remote
# therefore discards real secrets that exist nowhere else -- which is exactly
# what happened: two API keys committed locally and never pushed were dropped.
#
# Same rule as the dotfiles role: clone when absent, update only when the
# checkout is provably clean and not ahead of the remote.
- name: Check whether the pass store is already checked out
  ansible.builtin.stat:
    path: "{{ pass_store_dir }}/.git"
  register: pass_checkout

- name: Clone pass store repo
  ansible.builtin.git:
    repo: "{{ pass_repo }}"
    dest: "{{ pass_store_dir }}"
    version: main
    accept_hostkey: true
  when: not pass_checkout.stat.exists
  become: true
  become_user: "{{ user_name }}"

# The git module clones and updates; it cannot report whether a checkout is
# dirty or how far ahead it is. Those answers are the entire point of the
# guard below, so these three tasks shell out deliberately -- hence the noqa.
- name: Check the pass store for uncommitted changes # noqa: command-instead-of-module
  ansible.builtin.command: git status --porcelain
  args:
    chdir: "{{ pass_store_dir }}"
  register: pass_dirty
  changed_when: false
  when: pass_checkout.stat.exists
  become: true
  become_user: "{{ user_name }}"

- name: Fetch pass store remote refs # noqa: command-instead-of-module
  ansible.builtin.command: git fetch origin main
  args:
    chdir: "{{ pass_store_dir }}"
  changed_when: false
  failed_when: false
  when: pass_checkout.stat.exists
  become: true
  become_user: "{{ user_name }}"

- name: Count unpushed pass store commits # noqa: command-instead-of-module
  ansible.builtin.command: git rev-list --count origin/main..HEAD
  args:
    chdir: "{{ pass_store_dir }}"
  register: pass_ahead
  changed_when: false
  when: pass_checkout.stat.exists
  become: true
  become_user: "{{ user_name }}"

- name: Update the pass store only when it is safe to do so
  ansible.builtin.git:
    repo: "{{ pass_repo }}"
    dest: "{{ pass_store_dir }}"
    version: main
    accept_hostkey: true
    update: true
  when:
    - pass_checkout.stat.exists
    - pass_dirty.stdout | default('') | trim == ''
    - pass_ahead.stdout | default('0') | int == 0
  become: true
  become_user: "{{ user_name }}"

- name: Report a skipped pass store update
  ansible.builtin.debug:
    msg: >-
      Left {{ pass_store_dir }} alone: it has
      {{ pass_dirty.stdout_lines | default([]) | length }} uncommitted
      change(s) and {{ pass_ahead.stdout | default('0') }} unpushed commit(s).
      Updating would have discarded secrets that exist nowhere else. Push the
      store, then re-run.
  when:
    - pass_checkout.stat.exists
    - (pass_dirty.stdout | default('') | trim != '') or
      (pass_ahead.stdout | default('0') | int > 0)

- name: Read pass store GPG id
  ansible.builtin.slurp:
    src: "{{ pass_store_dir }}/.gpg-id"
  register: pass_gpg_id
  become: true
  become_user: "{{ user_name }}"

- name: Ensure pass store GPG id matches
  ansible.builtin.assert:
    that:
      - "gpg_fingerprint in (pass_gpg_id.content | b64decode)"
    fail_msg: "pass store .gpg-id does not match the expected fingerprint."
  become: true
  become_user: "{{ user_name }}"

- name: Initialize pass store if missing
  ansible.builtin.command: "pass init {{ gpg_fingerprint }}"
  args:
    creates: "{{ pass_store_dir }}/.gpg-id"
  become: true
  become_user: "{{ user_name }}"
