---
# Personal machine. Keeps its existing hostname deliberately: the name is
# recorded in SSH configs and elsewhere, so renaming has a real blast radius
# for no gain. The `hostname` task therefore asserts reality here rather than
# changing anything.
hostname: archbox

# Personal-only software.
extra_packages:
  - qbittorrent
  - blender
  - godot
  - moonlight-qt
  - obs-studio
  - proton-vpn-cli
  - gimp

extra_aur_packages:
  # Lenovo ThinkPad dock daemon -- hardware-specific, and this machine is a
  # ThinkPad. It was previously in the shared dev role, filed there because the
  # name reads as docker-adjacent; it has nothing to do with Docker and would
  # be meaningless on the HP work machine. Note it depends on libxrandr and so
  # predates the move to Wayland -- worth checking whether it still does
  # anything now the dock is DisplayLink.
  - dockd

# Work tooling already on this machine is deliberately NOT managed here: it is
# installed, it works, and this machine is the backup. Ansible simply leaves it
# alone rather than adopting or removing it.

# One personal identity. The work identities present on this machine are
# likewise unmanaged, for the same reason. See issue #8.
ssh_keys:
  - name: id_ed25519
    comment: jdj.dev90@gmail.com
