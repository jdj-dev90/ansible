---
- name: Ensure shell packages are installed
  ansible.builtin.package:
    name:
      - zsh
      - zsh-completions
      - tmux
      - vim
      - fzf
      - zoxide
      - keychain
      # clipboard (X11 side; the Wayland tools live in the gui role)
      - xclip
      - xsel
      # modern coreutils replacements
      - ripgrep
      - fd
      - eza
      - bat
      # data wrangling
      - jq
      - yq
      - fx
      - tabiew
      # system inspection
      - htop
      - btop
      - tldr
      # file managers
      - nnn
      - vifm
    state: present

- name: Install shell AUR packages
  ansible.builtin.include_role:
    name: aur
  vars:
    aur_packages:
      - ncpamixer
      - pacmixer
      - neofetch
