---
# Reusable AUR installer. Each role owns its own `aur_packages` list and
# includes this role, rather than a single centralized list:
#
#   - name: Install dev AUR packages
#     ansible.builtin.include_role:
#       name: aur
#     vars:
#       aur_packages:
#         - neovim-nightly-bin
#
# yay must never run as root, hence become: false throughout.
- name: Check that yay is available
  ansible.builtin.command: which yay
  register: aur_yay
  changed_when: false
  failed_when: false
  become: false

- name: Fail if yay is missing
  ansible.builtin.fail:
    msg: "yay not found. Run bootstrap/arch-bootstrap.sh before the playbook."
  when: aur_yay.rc != 0

- name: List installed packages
  ansible.builtin.command: pacman -Qq
  register: aur_installed
  changed_when: false
  become: false

# yay must not run as root, but makepkg escalates internally to `sudo pacman`
# for build and runtime dependencies. Under Ansible there is no TTY and no
# cached sudo timestamp (Arch uses timestamp_type=tty, so priming elsewhere
# does not carry), and the build dies with "a terminal is required to read the
# password".
#
# So grant passwordless sudo for pacman ONLY, for the duration of the build,
# and remove it in an `always` block so a failed build cannot leave the grant
# behind. Narrow (one binary), temporary (same play), and validated by visudo
# before it is written -- a malformed sudoers file locks the machine out of
# sudo entirely.
# Some AUR PKGBUILDs declare validpgpkeys and makepkg imports them from a
# keyserver. On a freshly built machine there is no ~/.gnupg and no keyserver
# configured, so the import fails with "keyserver receive failed: No data" and
# takes the whole build down. An existing machine never shows this, because it
# has years of accumulated keyring state.
- name: Ensure a GnuPG home exists
  ansible.builtin.file:
    path: "{{ user_home }}/.gnupg"
    state: directory
    mode: "0700"
    owner: "{{ user_uid }}"
    group: "{{ user_gid }}"
  become: true

- name: Configure a keyserver for source verification
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.gnupg/gpg.conf"
    line: "keyserver hkps://keyserver.ubuntu.com"
    regexp: "^keyserver "
    create: true
    mode: "0600"
    owner: "{{ user_uid }}"
    group: "{{ user_gid }}"
  become: true

- name: Install AUR packages
  when: aur_missing | length > 0
  vars:
    aur_missing: "{{ aur_packages | difference(aur_installed.stdout_lines) }}"
  block:
    - name: Permit passwordless pacman for the build
      ansible.builtin.copy:
        dest: /etc/sudoers.d/10-ansible-aur
        content: "{{ user_name }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
        mode: "0440"
        owner: root
        group: root
        validate: visudo -cf %s
      become: true

    - name: Install missing AUR packages
      ansible.builtin.command: >-
        yay -S --needed --noconfirm --removemake
        --answerclean None --answerdiff None
        {{ aur_missing | join(' ') }}
      changed_when: true
      become: false

  always:
    - name: Revoke the temporary pacman sudo grant
      ansible.builtin.file:
        path: /etc/sudoers.d/10-ansible-aur
        state: absent
      become: true
