---
# Shared by every machine. Anything that genuinely differs per machine belongs
# in vars/<hostname>.yml instead.
user_name: jordan
user_home: /home/jordan

timezone: Australia/Brisbane
locale: en_AU.UTF-8

dotfiles_repo: git@github.com:jdj-dev90/.dotfiles.git

# Canonical stow package list. The dotfiles repo declares the same value in
# zsh/.zsh_profile; the dotfiles role asserts the two agree so drift is loud
# rather than silent.
stow_folders: "bin,nvim,tmux,zsh,wayland,ghostty,gitconfig,wallpapers,ssh"

pass_repo: git@github.com:jdj-dev90/pwd-store.git
pass_store_dir: /home/jordan/.password-store
gpg_key_path: /home/jordan/Downloads/secret.gpg
gpg_fingerprint: 5EDF4EFC982097211EFA22820E3D38ACB02C5925

# systemd --user units shipped by the dotfiles `wayland` stow package.
user_services:
  - waybar.service
  - swaync.service
  - audio-defaults.service
