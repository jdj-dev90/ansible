---
# Key identities are per-machine data, supplied by vars/<hostname>.yml, rather
# than one hardcoded personal key -- a second machine needs a different set.
# gnome-keyring's gcr agent hijacks SSH_AUTH_SOCK via a set-environment call in
# its socket unit. It answers a key listing instantly but blocks forever on a
# signing request, waiting for a graphical confirmation -- so anything
# non-interactive hangs rather than failing, and BatchMode does not help
# because the block is in the agent, not in ssh.
#
# It is enabled in GLOBAL scope, so disabling it per-user does not survive a
# re-login. Masking is what actually sticks. Only the ssh half is disabled;
# gnome-keyring's secrets and pkcs11 components are untouched.
- name: Mask the gnome-keyring SSH agent
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    masked: true
    enabled: false
  loop:
    - gcr-ssh-agent.socket
    - gcr-ssh-agent.service
  become: true
  become_user: "{{ user_name }}"

# Arch ships this; it needs SSH_AUTH_SOCK pointed at it, which the dotfiles
# `wayland` package does via .config/environment.d/10-ssh-agent.conf.
- name: Enable the plain OpenSSH agent
  ansible.builtin.systemd_service:
    name: ssh-agent.socket
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ user_name }}"

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.ssh"
    state: directory
    mode: "0700"
    owner: "{{ user_uid }}"
    group: "{{ user_gid }}"

- name: Check for existing SSH keys
  ansible.builtin.stat:
    path: "{{ user_home }}/.ssh/{{ item.name }}"
  register: ssh_key_stat
  loop: "{{ ssh_keys }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate missing SSH keys
  ansible.builtin.command: >-
    ssh-keygen -t ed25519 -C "{{ item.item.comment }}"
    -f "{{ user_home }}/.ssh/{{ item.item.name }}" -N ""
  when: not item.stat.exists
  changed_when: true
  loop: "{{ ssh_key_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  become: true
  become_user: "{{ user_name }}"

- name: Read public keys
  ansible.builtin.slurp:
    src: "{{ user_home }}/.ssh/{{ item.name }}.pub"
  register: ssh_key_pub
  loop: "{{ ssh_keys }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ user_name }}"

# Only surface keys that were just created. Showing and pausing on every run
# would block an otherwise unattended playbook forever, on a machine whose keys
# were uploaded long ago.
- name: Note which keys were newly generated
  ansible.builtin.set_fact:
    ssh_keys_new: >-
      {{ ssh_key_stat.results
         | rejectattr('stat.exists')
         | map(attribute='item.name') | list }}

- name: Show public keys for upload
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}:
      {{ item.content | b64decode | trim }}
  loop: "{{ ssh_key_pub.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.item.name in ssh_keys_new

- name: Pause for key upload
  ansible.builtin.pause:
    prompt: >-
      Add the keys above to their remotes (GitHub, GitLab, Bitbucket as
      applicable), then press Enter.
  when: ssh_keys_new | length > 0

# This is the gate for everything downstream: the dotfiles and password-store
# clones both need working SSH, and would otherwise fail deep inside a role
# with a less obvious message.
#
# It deliberately runs AFTER key generation and the upload pause. An earlier
# version checked this in pre_tasks, which made a fresh machine unbuildable:
# no key exists yet, so the check failed and aborted the play before the role
# that creates the key could run.
#
# `timeout` is required, not defensive -- a graphical SSH agent blocks
# indefinitely on signing rather than failing, and BatchMode does not help
# because the block is in the agent. Retries cover GitHub throttling rapid
# repeat connections, which presents as "Connection closed by ...".
- name: Verify GitHub SSH access
  ansible.builtin.command: >-
    timeout 25 ssh -T -o BatchMode=yes -o ConnectTimeout=15
    -o StrictHostKeyChecking=accept-new git@github.com
  register: ssh_key_test
  changed_when: false
  failed_when: false
  retries: 3
  delay: 5
  until: "'successfully authenticated' in (ssh_key_test.stderr | default(''))"
  become: true
  become_user: "{{ user_name }}"

- name: Fail if GitHub SSH is unusable
  ansible.builtin.fail:
    msg: >-
      SSH to GitHub did not authenticate, so the dotfiles and password-store
      clones cannot run. If ssh reported nothing below, the agent blocked and
      the check timed out -- typically gnome-keyring's gcr agent waiting on a
      GUI prompt; load the key into a plain ssh-agent instead. If the key was
      only just generated, confirm it was actually added to GitHub.
      ssh said: {{ ssh_key_test.stderr | default('') | trim }}
  when: "'successfully authenticated' not in (ssh_key_test.stderr | default(''))"
