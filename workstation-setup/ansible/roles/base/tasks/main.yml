---
# System plumbing only. Anything with a service or firmware side effect
# (network stack, bootloader, kernel, firmware) belongs to the archinstall
# baseline, not here -- see issue #11.
- name: Ensure base packages are installed
  ansible.builtin.package:
    name:
      - sudo
      - openssh
      - curl
      - wget
      - unzip
      - zip
      - unrar
      - 7zip
      - tar
      - gzip
      - ca-certificates
      - rsync
      - stow
      - man-db
      - which
      - lsof
      - file
      - tree-sitter-cli
      - inetutils
      - usbutils
      - acpi
      - pacman-contrib
      - pkgfile
      - ntfs-3g
      - exfatprogs
      - dosfstools
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: Read current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: base_timezone_current
  changed_when: false

- name: Set timezone
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  when: base_timezone_current.stdout != timezone
  changed_when: base_timezone_current.stdout != timezone

- name: Ensure locale is enabled
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?{{ locale }}'
    line: '{{ locale }} UTF-8'

# Generation is driven by observed state, not by a handler on the line above.
# A handler only fires when locale.gen CHANGES -- so if the file is already
# correct but the locale was never generated, the handler never runs and the
# gap never closes. That is not hypothetical: it is exactly what happened here,
# leaving locale.conf pointing at a locale that did not exist.
- name: Read generated locales
  ansible.builtin.command: locale -a
  register: base_locales
  changed_when: false

- name: Generate locales
  ansible.builtin.command: locale-gen
  when: locale | replace('UTF-8', 'utf8') not in base_locales.stdout_lines
  changed_when: true

# Written LAST, so the system is never pointed at a locale that does not yet
# exist -- even if the play fails part way through.
- name: Set locale.conf
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ locale }}\n"
    mode: "0644"
