---
- name: Workstation setup
  hosts: localhost
  connection: local
  become: true

  vars:
    # Which machine is this? Defaults to the running hostname, so a named
    # machine needs no arguments. A freshly installed box whose hostname is
    # not set yet is told explicitly:
    #   ansible-playbook playbook.yml -e profile=jordan-work
    profile: "{{ ansible_hostname }}"

  vars_files:
    - vars/common.yml
    - "vars/{{ profile }}.yml"

  pre_tasks:
    - name: Show which profile is being applied
      ansible.builtin.debug:
        msg: >-
          profile={{ profile }} hostname={{ hostname }}
          (running hostname: {{ ansible_hostname }})

    - name: Fail early if this machine has no profile
      ansible.builtin.assert:
        that:
          - hostname is defined
        fail_msg: >-
          No vars/{{ profile }}.yml found. Create one, or pass a known profile
          with -e profile=<name>.

  roles:
    - base
    - dev
    - ssh_key
    - dotfiles
    - shell
    - lang
    # Work tooling. Correct as an end state: it currently also lives on archbox
    # out of necessity, but that install is manual and is left alone -- this
    # playbook simply does not manage it there. See issue #6.
    - role: cloud
      when: profile == 'jordan-work'
    # Password store. Used on both machines today; how it should be split is
    # still open. See issue #9.
    - pass
    - gui
    - apps
