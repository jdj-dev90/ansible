---
- name: Ensure shell packages are installed
  ansible.builtin.package:
    name:
      - zsh
      - zsh-completions
      - tmux
      - vim
      - fzf
      - zoxide
      - keychain
      # clipboard (X11 side; the Wayland tools live in the gui role)
      - xclip
      - xsel
      # modern coreutils replacements
      - ripgrep
      - fd
      - eza
      - bat
      # data wrangling
      - jq
      - yq
      - fx
      - tabiew
      # system inspection
      - fastfetch
      - htop
      - btop
      - tldr
      # file managers
      - nnn
      - vifm
    state: present

- name: Install shell AUR packages
  ansible.builtin.include_role:
    name: aur
  vars:
    aur_packages:
      # neofetch is gone: upstream archived it in 2024 and the key its PKGBUILD
      # pins is on no keyserver any more, so the AUR build cannot verify its
      # sources and fails. fastfetch is the maintained successor and lives in
      # the official repos, so it is in the package list above rather than here.
      - ncpamixer
      - pacmixer
