---
- name: Ensure language toolchain packages are installed
  ansible.builtin.package:
    name:
      # go
      - go
      - golangci-lint
      # python
      - python
      - python-pip
      - pyenv
      # node -- nvm, not fnm: fnm was declared but has never been installed
      - nodejs
      - npm
      - nvm
      # rust tooling
      - rust-analyzer
      # linters / formatters
      - eslint
      - eslint_d
      - stylua
      - yamllint
      # build deps for pyenv-compiled interpreters
      - openssl
      - zlib
      - xz
      - bzip2
      - libffi
      - sqlite
      - readline
      - tk
    state: present
